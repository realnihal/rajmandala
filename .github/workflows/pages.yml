name: Deploy game screen to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the game screen
        working-directory: packages/web
        env:
          # Address of the game server on Cloudflare (repository variable API_BASE).
          VITE_API_BASE: ${{ vars.API_BASE }}
        run: npx vite build --config vite.pages.config.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
