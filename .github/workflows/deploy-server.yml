name: Deploy game server to Cloudflare

# Runs when the server or the rules change. Needs two repository secrets:
# CLOUDFLARE_API_TOKEN (with permission to edit Workers) and CLOUDFLARE_ACCOUNT_ID.
# Without them the job is skipped, and the server is deployed by hand with `npx cf deploy`.
on:
  push:
    branches: [main]
    paths:
      - packages/engine/**
      - packages/server/**
      - packages/web/**
      - package-lock.json
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.present == 'true'
      - run: npm test
        if: steps.creds.outputs.present == 'true'
      - name: Deploy
        if: steps.creds.outputs.present == 'true'
        working-directory: packages/web
        run: npx cf deploy --message "${{ github.sha }}"
